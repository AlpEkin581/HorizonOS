<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>HorizonOS Terminal</title>
  <style>
    /* Tüm tarayıcı boşluklarını sıfırlıyoruz */
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }
    
    /* 🔒 GÖVDEDEN KİLİTLEME:
       Sayfa boyutunun dışarı taşmasını, tarayıcıda ana scrollbar çıkmasını engelliyoruz.
    */
    html, body { 
      width: 100%;
      height: 100%;
      min-width: 750px;
      min-height: 500px;
      overflow: hidden !important; /* Dış ekranın kaymasını kesin olarak engeller */
      background: #0d1117; 
    }

    /* 🚀 Terminal Ana Yapısı (Flexbox) */
    #root {
      width: 100%;
      height: 100vh; /* Ekran yüksekliğine tamamen kilitlenir */
      display: flex !important;
      flex-direction: column !important; /* Her şeyi yukarıdan aşağıya dizer */
      padding: 15px;
      font-family: 'Courier New', Courier, monospace !important;
      font-size: 14px !important;
      line-height: 1.4 !important;
      overflow: hidden !important; /* Root dışına taşmayı engeller */
    }

    /* 💡 Üst taraftaki şık komut bilgilendirme banner'ı */
    .terminal-welcome-banner {
      width: 100%;
      background: rgba(0, 188, 212, 0.1);
      border-left: 4px solid #00bcd4;
      color: #00bcd4;
      padding: 10px 15px;
      font-size: 13px !important;
      margin-bottom: 15px;
      box-shadow: 0 0 10px rgba(0, 188, 212, 0.1);
      flex-shrink: 0; /* Asla yukarı doğru sıkışmaz */
    }

    /* 📜 İŞTE BUG'I ÇÖZEN ANA YER: ÇIKTI ALANI */
    /* Ne yazılırsa yazılsın, js nereye ekleme yaparsa yapsın bu alan kendi içinde kayacak */
    #root > div:not(.terminal-welcome-banner), 
    .output-area, 
    #output, 
    .terminal-content,
    .terminal {
      flex: 1 !important; /* Kalan tüm dikey boşluğu bu kaplar */
      overflow-y: auto !important; /* Sadece burası kendi içinde pürüzsüzce kayar */
      width: 100% !important;
      padding-bottom: 10px;
    }

    /* 🛠️ Giriş Satırı / Alt Bar */
    /* Çıktılar ne kadar çoğalırsa çoğalsın, bu bar hep ekranın en altında sabit çakılı kalır */
    .status-bar, .bottom-bar, footer, .input-line {
      width: 100% !important;
      background: #0d1117 !important; 
      margin-top: auto !important; /* En alta yapışmasını garantiler */
      padding-top: 8px !important;
      flex-shrink: 0 !important; /* Asla ezilmez veya aşağı kaçmaz */
    }

    /* Özel siberpunk kaydırma çubuğu */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: rgba(0,188,212,0.35); border-radius: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>
<body>

  <div id="root">
    <div class="terminal-welcome-banner">
      [BİLGİ] Komutları öğrenmek için lütfen terminale <strong style="text-decoration: underline;">help</strong> yazın.
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
