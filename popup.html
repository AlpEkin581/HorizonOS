<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>HorizonOS Terminal</title>
  <style>
    /* Tüm tarayıcı boşluklarını sıfırlıyoruz */
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }
    
    /* 🔒 Sabit genişlik ve güvenli yükseklik vererek görev çubuğunun arkasına kaçmasını engelliyoruz */
    html, body { 
      width: 800px !important; 
      height: 540px !important; 
      overflow: hidden; 
      background: #0d1117; 
      font-family: 'Courier New', Courier, monospace;
    }

    /* 🚀 Terminal ana kapsayıcısını flex-column yapıyoruz */
    #root {
      width: 100% !important;
      height: 100% !important;
      display: flex !important;
      flex-direction: column !important; /* Elemanları yukarıdan aşağıya dizer */
      padding: 15px;
      box-sizing: border-box !important;
    }

    /* 💡 Üst taraftaki şık komut bilgilendirme banner'ı */
    .terminal-welcome-banner {
      width: 100%;
      background: rgba(0, 188, 212, 0.1); /* Hafif saydam mavi */
      border-left: 4px solid #00bcd4; /* Sol siberpunk şerit */
      color: #00bcd4;
      padding: 10px 15px;
      font-size: 14px;
      margin-bottom: 15px;
      box-shadow: 0 0 10px rgba(0, 188, 212, 0.1);
      flex-shrink: 0; /* Sıkışmasını engeller */
    }

    /* 📜 Logların ve çıktıların aktığı orta alan (Kalan tüm dikey boşluğu bu doldurur) */
    .output-area, #output, .terminal-content {
      width: 100% !important;
      flex: 1 !important; 
      overflow-y: auto !important; /* İçerik uzadıkça kendi içinde pürüzsüz kaydırma sağlar */
    }

    /* 🛠️ Alt Bar / Komut Giriş Alanı Yapısı */
    .status-bar, .bottom-bar, footer {
      width: 100% !important;
      background: #0d1117 !important; 
      margin-top: auto !important; /* Her zaman en altta kalmaya zorlar */
      padding: 8px 0px !important;
      box-sizing: border-box !important;
      flex-shrink: 0; /* Alt barın dikeyde ezilmesini engeller */
    }

    /* Özel siberpunk kaydırma çubuğu tasarımların */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: rgba(0,188,212,0.35); border-radius: 3px; }
  </style>
</head>
<body>

  <div id="root">
    <div class="terminal-welcome-banner">
      [BİLGİ] Komutları öğrenmek için lütfen terminale <strong style="text-decoration: underline;">help</strong> yazın.
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
